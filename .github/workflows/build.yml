name: Build Parsec Packages

on:
  push:
    tags:
      - 'v*'
      - '150-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-notes:
    name: "Generate Release Notes"
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# Parsec $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Repackaged from official Parsec Linux build." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "chmod +x parsec-x86_64.AppImage" >> release_notes.md
          echo "./parsec-x86_64.AppImage" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "sudo dpkg -i parsec_*.deb" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "### RPM (Fedora/RHEL/openSUSE)" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "sudo rpm -i parsec-x86_64.rpm" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Note" >> release_notes.md
          echo "" >> release_notes.md
          echo "Parsec auto-updates itself on launch by downloading the latest binary to \`~/.parsec/\`." >> release_notes.md
          echo "All package formats support this behavior." >> release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  deb:
    name: "Debian Package (amd64)"
    runs-on: ubuntu-24.04
    needs: release-notes
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper-compat wget dpkg-dev build-essential

      - name: Build Debian package
        run: |
          debuild -us -uc -b

      - name: Copy .deb to workspace
        run: |
          cp ../parsec_*.deb .

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsec-deb
          path: parsec_*.deb

      - name: Download release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Release Debian package
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: parsec_*.deb
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  appimage:
    name: "AppImage (amd64)"
    runs-on: ubuntu-24.04
    needs: release-notes
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget fuse libfuse2

      - name: Download official Parsec .deb
        run: |
          wget -q https://builds.parsec.app/package/parsec-linux.deb -O parsec-linux.deb

      - name: Extract .deb to AppDir
        run: |
          dpkg-deb -x parsec-linux.deb appdir

      - name: Fix AppDir structure
        run: |
          cp appdir/usr/share/applications/parsecd.desktop appdir/parsec.desktop
          cp appdir/usr/share/icons/hicolor/256x256/apps/parsecd.png appdir/parsecd.png
          # Fix desktop file icon reference
          sed -i 's|Icon=/usr/share/icons/hicolor/256x256/apps/parsecd.png|Icon=parsecd|' appdir/parsec.desktop
          chmod +x appdir/AppRun

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool --no-appstream appdir parsec-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsec-appimage
          path: parsec-x86_64.AppImage

      - name: Download release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Release AppImage
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: parsec-x86_64.AppImage
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rpm:
    name: "RPM Package (amd64)"
    runs-on: ubuntu-24.04
    needs: release-notes
    steps:
      - uses: actions/checkout@v4

      - name: Install alien and rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y alien rpm

      - name: Download official Parsec .deb
        run: |
          wget -q https://builds.parsec.app/package/parsec-linux.deb -O parsec-linux.deb

      - name: Convert to RPM
        run: |
          sudo alien --to-rpm --scripts parsec-linux.deb

      - name: Rename RPM
        run: |
          mv parsec-*.rpm parsec-x86_64.rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsec-rpm
          path: parsec-x86_64.rpm

      - name: Download release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Release RPM
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: parsec-x86_64.rpm
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}